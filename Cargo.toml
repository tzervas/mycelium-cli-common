[package]
name = "mycelium-cli-common"
version.workspace = true
description = "mycelium-cli-common (M-643) — the small, dependency-free helper shared by the toolchain CLIs (mycfmt / myc-check / myc-lint / myc-sec). Folds out the duplicated stdin-or-file `read_source`, the `.myc` source-walking, and the hand-rolled arg loop. Never-silent on missing/ambiguous input (G2): a refusal prints to stderr and yields a structured outcome the caller maps to its existing exit code; behaviour-preserving (DRY/KISS, KC-3). No new external dependency — std only."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Intentionally empty: cli-common is std-only (KC-3 — a new external dependency is an ADR, not a
# refactor). The four CLI bins gain a *path* dependency on this crate; nothing new enters the tree.

# --- standalone workspace root (course-correction Phase B, 2026-07-18; steer handoff §6.2) ---
[workspace]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-cli-common"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true
